---
layout: default
---
<div class="post art-entry">
  <header class="post-header art-entry-header">
    <div class="art-entry-header-copy">
      <p class="art-entry-back"><a href="{{ '/art/' | relative_url }}">&larr; Back to Art</a></p>
      <h1 class="post-title">{{ page.title }}</h1>
      <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
      {% if page.description %}
        <p class="post-description">{{ page.description }}</p>
      {% endif %}
    </div>

    {% if page.cover %}
      <figure class="art-entry-cover">
        <img src="{{ page.cover | relative_url }}" alt="{{ page.cover_alt | default: page.title }}">
        {% if page.cover_caption %}
          <figcaption>{{ page.cover_caption }}</figcaption>
        {% endif %}
      </figure>
    {% endif %}
  </header>

  <article class="post-content">
    {{ content }}
  </article>

  {% if page.images %}
    <section class="art-entry-gallery">
      {% for image in page.images %}
        <figure class="art-entry-gallery-item">
          <img src="{{ image.path | relative_url }}" alt="{{ image.alt | default: page.title }}">
          {% if image.caption %}
            <figcaption>{{ image.caption }}</figcaption>
          {% endif %}
        </figure>
      {% endfor %}
    </section>
  {% endif %}
</div>
